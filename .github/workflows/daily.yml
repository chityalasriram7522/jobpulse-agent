name: JobPulse Daily Digest

on:
  schedule:
    # Runs every morning before 8:00 AM India Standard Time (IST)
    # Calculation: 02:13 AM UTC = 7:43 AM IST (off-peak minute to reduce GitHub cron queue delay)
    - cron: '13 2 * * *'
  workflow_dispatch: # Allows you to trigger the job manually anytime from the GitHub Actions tab

# Permissions required to commit the SQLite database back to the repository
permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run JobPulse Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'jobpulse-sriram-chityala' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py

      - name: Persist SQLite Memory (Commit and push sent_jobs.db)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sent_jobs.db ]; then
            git add sent_jobs.db
            git diff --staged --quiet || (git commit -m "chore(db): update sent_jobs memory [skip ci]" && git push)
          fi
